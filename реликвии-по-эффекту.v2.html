<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Реликвии BDO — поиск комбинаций и эффектов</title>
<style>
  :root { --bg:#14171c; --card:#1e232b; --card2:#242b35; --text:#e6e9ef; --muted:#9aa5b1; --accent:#e8b64c; --border:#2f3742; --green:#8fd47a; --gray:#b0b8c2; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Segoe UI, Roboto, Arial, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:18px 24px; background:linear-gradient(135deg,#1a1f27,#232a35); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  header h1 { margin:0 0 2px; font-size:19px; color:var(--accent); }
  header p { margin:0; color:var(--muted); font-size:13px; }
  .topbtns { display:flex; gap:10px; }
  .btn { padding:9px 14px; border-radius:8px; border:1px solid var(--border); background:var(--card2); color:var(--text); cursor:pointer; font-size:14px; }
  .btn:hover { border-color:var(--accent); }
  .wrap { max-width:980px; margin:0 auto; padding:20px 24px 60px; }
  .searchfields { display:flex; gap:14px; flex-wrap:wrap; }
  .field { flex:1; min-width:220px; }
  .field label { display:block; text-transform:uppercase; font-size:11px; letter-spacing:.5px; color:var(--muted); margin-bottom:6px; }
  .field input { width:100%; padding:13px 14px; font-size:15px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--text); outline:none; }
  .field input:focus { border-color:var(--accent); }
  .count { margin:14px 2px 10px; color:var(--muted); font-size:13px; }
  .count b { color:var(--text); }
  .result { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:14px; }
  .result h3 { margin:0 0 12px; font-size:17px; color:var(--accent); }
  .row { display:flex; flex-wrap:wrap; gap:20px; }
  .col { flex:1; min-width:220px; }
  .label { text-transform:uppercase; font-size:11px; letter-spacing:.5px; color:var(--muted); margin-bottom:6px; }
  .tag { display:inline-block; background:var(--card2); border:1px solid var(--border); border-radius:20px; padding:4px 12px; margin:3px 4px 3px 0; font-size:14px; }
  .tag.eff { background:#22301f; border-color:#3f6b36; color:var(--green); }
  .tag.stone { background:#2b2f35; border-color:#4a5260; color:var(--gray); }
  .empty { color:var(--muted); padding:30px; text-align:center; }
  /* modal */
  .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50; align-items:flex-start; justify-content:center; padding:30px 16px; overflow:auto; }
  .overlay.open { display:flex; }
  .modal { background:var(--card); border:1px solid var(--border); border-radius:12px; width:100%; max-width:820px; padding:20px; }
  .modal h2 { margin:0 0 14px; font-size:18px; color:var(--accent); }
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  .tab { padding:8px 14px; border-radius:8px; border:1px solid var(--border); background:var(--card2); color:var(--muted); cursor:pointer; font-size:14px; }
  .tab.active { background:#3a3220; border-color:var(--accent); color:var(--accent); }
  .panel { display:none; }
  .panel.active { display:block; }
  .gcombo { display:grid; grid-template-columns:200px 1fr 1fr 44px; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); align-items:start; }
  .gstone { display:grid; grid-template-columns:240px 1fr 44px; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); align-items:start; }
  .mhead { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px; padding:10px 0 6px; }
  .mhead.gcombo { display:grid; grid-template-columns:200px 1fr 1fr 44px; gap:10px; }
  .mhead.gstone { display:grid; grid-template-columns:240px 1fr 44px; gap:10px; }
  .editfield input, .editfield textarea { background:var(--card2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:8px 10px; font-size:14px; font-family:inherit; width:100%; }
  .editfield textarea { resize:vertical; min-height:46px; }
  .editfield input { height:38px; }
  .del { color:#e06666; border-color:#6b2f2f; cursor:pointer; height:38px; }
  .modal-footer { display:flex; justify-content:flex-end; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .delete { color:#e06666; border-color:#6b2f2f; cursor:pointer; }
  .savebtn { background:var(--accent); color:#1a1508; border:1px solid var(--accent); font-weight:600; }
  .scrollarea { max-height:60vh; overflow:auto; }
  .panelempty { color:var(--muted); padding:16px 0; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Реликвии — комбинации и эффекты камней</h1>
    <p>Выбери эффект — увидишь все комбинации. Зелёное — эффекты комбинации, серое — эффекты камней.</p>
  </div>
  <div class="topbtns">
    <button class="btn" id="catalogBtn">Каталог / Редактор</button>
  </div>
</header>
<div class="wrap">
  <div class="searchfields">
    <div class="field">
      <label for="qeff">Эффекты</label>
      <input type="text" id="qeff" list="dlEff" placeholder="напр. «Вся атака»" autocomplete="off">
      <datalist id="dlEff"></datalist>
    </div>
    <div class="field">
      <label for="qname">Названия комбинаций</label>
      <input type="text" id="qname" list="dlName" placeholder="напр. «Молитва»" autocomplete="off">
      <datalist id="dlName"></datalist>
    </div>
    <div class="field">
      <label for="qstone">Названия камней</label>
      <input type="text" id="qstone" list="dlStone" placeholder="напр. «огонь-Хищник»" autocomplete="off">
      <datalist id="dlStone"></datalist>
    </div>
  </div>
  <div class="count" id="count"></div>
  <div id="results"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Каталог эффектов и редактирование</h2>
    <div class="tabs">
      <button class="tab active" data-tab="combo">Эффекты комбинаций</button>
      <button class="tab" data-tab="stone">Эффекты камней</button>
    </div>
    <div class="scrollarea">
      <div class="panel active" id="panel-combo"></div>
      <div class="panel" id="panel-stone"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" id="addCombo">+ Добавить комбинацию</button>
      <button class="btn" id="addStone">+ Добавить камень</button>
      <button class="btn" id="resetData">Сбросить правки</button>
      <button class="btn savebtn" id="saveData">Сохранить</button>
      <button class="btn" id="closeModal">Закрыть</button>
    </div>
  </div>
</div>

const LS_COMBOS = 'relics.combos.v3';
const LS_STONES = 'relics.stones.v3';

function loadCombos(){ try{ const v=JSON.parse(localStorage.getItem(LS_COMBOS)); if(Array.isArray(v)) return v; }catch(e){} return DEFAULT_COMBOS; }
function loadStones(){ try{ const v=JSON.parse(localStorage.getItem(LS_STONES)); if(v&&typeof v==='object') return v; }catch(e){} return DEFAULT_STONEMAP; }

let COMBOS = loadCombos();
let STONEMAP = loadStones();

function baseOf(e){ return e.replace(/\s*[+\-]\d+(?:\s*%|\s*[A-Za-z]+)?\s*$/,'').trim(); }
function norm(s){ return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

for(const c of COMBOS){ c.base = c.effects.map(baseOf); }

function buildDataList(id, values){
  const dl = document.getElementById(id);
  dl.innerHTML = '';
  [...new Set(values)].sort((a,b)=>a.localeCompare(b,'ru')).forEach(v => {
    const o = document.createElement('option');
    o.value = v;
    dl.appendChild(o);
  });
}
function refreshDatalists(){
  const effs = [];
  const names = [];
  const stones = new Set();
  COMBOS.forEach(c => {
    c.effects.forEach(e => effs.push(baseOf(e)));
    names.push(c.name);
    c.stones.forEach(s => stones.add(s));
  });
  Object.keys(STONEMAP).forEach(s => stones.add(s));
  buildDataList('dlEff', effs);
  buildDataList('dlName', names);
  buildDataList('dlStone', [...stones]);
}

const inputEff = document.getElementById('qeff');
const inputName = document.getElementById('qname');
const inputStone = document.getElementById('qstone');
const resultsEl = document.getElementById('results');
const countEl = document.getElementById('count');
refreshDatalists();

// clear field on click
[inputEff, inputName, inputStone].forEach(inp => inp.addEventListener('focus', function(){ this.value=''; render(); }));

function stoneEffect(st){
  const s = STONEMAP[st];
  return s ? String(s) : '';
}

function render(){
  const eEff = inputEff.value.trim();
  const eName = inputName.value.trim();
  const eStone = inputStone.value.trim();
  const qEff = norm(eEff);
  const qName = norm(eName);
  const qStone = norm(eStone);
  const any = qEff || qName || qStone;
  let hits = [];
  if(any){
    hits = COMBOS.filter(c => {
      const mEff = qEff && (c.effects.some(e => norm(e).includes(qEff)) || c.base.some(b => norm(b) === qEff || norm(b).includes(qEff)));
      const mName = qName && norm(c.name).includes(qName);
      const mStone = qStone && c.stones.some(st => norm(st).includes(qStone));
      const effOk = qEff ? mEff : true;
      const nameOk = qName ? mName : true;
      const stoneOk = qStone ? mStone : true;
      return effOk && nameOk && stoneOk;
    });
  }
  if(hits.length === 0){
    countEl.textContent = any ? 'Совпадений: 0' : '';
    resultsEl.innerHTML = any ? '<div class="empty">Ничего не найдено</div>' : '';
    return;
  }
  countEl.innerHTML = 'Совпадений: <b>' + hits.length + '</b>';
  let html = '';
  hits.forEach(c => {
    const effTags = c.effects.map(e => '<span class="tag eff">' + esc(e) + '</span>').join('');
    const stoneTags = c.stones.map(st => {
      const se = stoneEffect(st);
      return '<span class="tag stone">' + esc(st) + (se ? ' — ' + esc(se) : '') + '</span>';
    }).join('');
    html += '<div class="result"><h3>' + esc('['+c.name+']') + '</h3>'
         + '<div class="row"><div class="col"><div class="label">Эффекты комбинации</div>' + effTags + '</div>'
         + '<div class="col"><div class="label">Камни (эффекты камней)</div>' + stoneTags + '</div></div></div>';
  });
  resultsEl.innerHTML = html;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    h += '<div class="gcombo">'
       + '<div class="editfield"><input data-i="'+i+'" data-k="name" value="'+esc(c.name)+'"></div>'
       + '<div class="editfield"><textarea data-i="'+i+'" data-k="effects">'+esc(c.effects.join('\n'))+'</textarea></div>'
       + '<div class="editfield"><textarea data-i="'+i+'" data-k="stones">'+esc(c.stones.join('\n'))+'</textarea></div>'
       + '<button class="btn del" data-delc="'+i+'">×</button>'
       + '</div>';
  });
  panelCombo.innerHTML = h;

  // stone panel
  h = '<div class="mhead gstone"><span>Камень</span><span>Эффект камня</span><span></span></div>';
  const stones = Object.keys(STONEMAP);
  stones.forEach(st => {
    h += '<div class="gstone">'
       + '<div class="editfield"><input data-s="key" data-k="'+esc(st)+'" value="'+esc(st)+'"></div>'
       + '<div class="editfield"><input data-s="val" data-k="'+esc(st)+'" value="'+esc(STONEMAP[st])+'"></div>'
       + '<button class="btn del" data-dels="'+esc(st)+'">×</button>'
       + '</div>';
  });
  panelStone.innerHTML = h;
}

// collect edits at save time (from DOM)
function collect(){
  document.querySelectorAll('#panel-combo .gcombo').forEach(row => {
    const i = +row.querySelector('[data-k="name"]').dataset.i;
    const name = row.querySelector('[data-k="name"]').value.trim();
    const effects = row.querySelector('[data-k="effects"]').value.split('\n').map(s=>s.trim()).filter(Boolean);
    const stones = row.querySelector('[data-k="stones"]').value.split('\n').map(s=>s.trim()).filter(Boolean);
    COMBOS[i] = { name, effects, stones };
  });
  document.querySelectorAll('#panel-stone .gstone').forEach(row => {
    const key = row.querySelector('[data-s="key"]').value.trim();
    const val = row.querySelector('[data-s="val"]').value.trim();
    if(key){
      const oldKey = row.querySelector('[data-s="key"]').dataset.k;
      if(oldKey !== key){ delete STONEMAP[oldKey]; }
      STONEMAP[key] = val;
    }
  });
}

document.getElementById('catalogBtn').addEventListener('click', () => {
  renderCatalog();
  overlay.classList.add('open');
});
document.getElementById('closeModal').addEventListener('click', () => overlay.classList.remove('open'));

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById('panel-'+t.dataset.tab).classList.add('active');
}));

document.getElementById('saveData').addEventListener('click', () => {
  collect();
  for(const c of COMBOS){ c.base = c.effects.map(baseOf); }
  localStorage.setItem(LS_COMBOS, JSON.stringify(COMBOS));
  localStorage.setItem(LS_STONES, JSON.stringify(STONEMAP));
  refreshDatalists();
  render();
  overlay.classList.remove('open');
});

document.getElementById('resetData').addEventListener('click', () => {
  localStorage.removeItem(LS_COMBOS);
  localStorage.removeItem(LS_STONES);
  COMBOS = loadCombos();
  STONEMAP = loadStones();
  for(const c of COMBOS){ c.base = c.effects.map(baseOf); }
  refreshDatalists();
  renderCatalog();
  render();
});

document.getElementById('addCombo').addEventListener('click', () => {
  COMBOS.push({ name:'Новая комбинация', effects:['Новый эффект +1'], stones:['камень-Пример'] });
  renderCatalog();
});
document.getElementById('addStone').addEventListener('click', () => {
  STONEMAP['камень-Новый'] = 'Эффект камня';
  renderCatalog();
});

overlay.addEventListener('click', e => { if(e.target===overlay) overlay.classList.remove('open'); });

document.getElementById('panel-combo').addEventListener('click', e => {
  const del = e.target.dataset.delc;
  if(del !== undefined){ COMBOS.splice(+del,1); renderCatalog(); }
});
document.getElementById('panel-stone').addEventListener('click', e => {
  const del = e.target.dataset.dels;
  if(del !== undefined){ delete STONEMAP[del]; renderCatalog(); }
});

[inputEff, inputName, inputStone].forEach(inp => inp.addEventListener('input', render));
render();
</script>
</body>
</html>
